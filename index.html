<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d111b"><meta name="description" content="Edit SRT and WebVTT subtitles without a heavyweight editor."><title>SubTrack</title><style>body{margin:0;background:#0d111b;color:#eef2ff;font:15px system-ui}main{max-width:1000px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;color:#89b4fa;font-weight:800}.hero{margin:28px 0}.hero h1{font-size:42px;margin:8px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#151c2a;border:1px solid #293449;border-radius:16px;padding:18px}.stack{display:grid;gap:10px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}label{display:grid;gap:5px;color:#9aa8bf;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;background:#0d1421;color:#eef2ff;border:1px solid #293449;border-radius:9px;padding:10px;font:inherit}button{background:#89b4fa;color:#101522;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.secondary{background:#29364c;color:#eef2ff}.danger{background:#482637;color:#ffdce5}.item{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #293449;border-radius:10px;margin-top:8px;background:#101725}.muted,small{color:#9aa8bf}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:24px;border:1px dashed #293449;border-radius:10px;text-align:center;color:#9aa8bf}.stats{display:flex;gap:8px}.stats div{flex:1;background:#101725;padding:10px;border-radius:10px;min-width:0}.stats b{display:block;font-size:20px;overflow-wrap:anywhere}footer{text-align:center;color:#9aa8bf;margin:25px;font-size:12px}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero h1{font-size:34px}}@media print{body{background:white;color:black}.panel{background:white;color:black}button,header,footer{display:none}}</style></head><body><main><header><span>SubTrack</span><small>LOCAL · PRIVATE · FREE</small></header><section class="hero"><small>ERROR404DTIR / OPEN SOURCE</small><h1>SubTrack</h1><p class="muted">Edit SRT and WebVTT subtitles without a heavyweight editor.</p></section><div class="layout"><section class="panel stack"><h3>Subtitle editor</h3><label>Open .srt / .vtt<input id="file" type="file" accept=".srt,.vtt,text/plain"></label><label>Subtitle text<textarea id="src" rows="16" placeholder="1&#10;00:00:01,000 --> 00:00:03,000&#10;Your subtitle"></textarea></label><div class="row"><label>Shift seconds<input id="shift" type="number" value="0" step=".1"></label><label>Format<select id="fmt"><option>srt</option><option>vtt</option></select></label></div><div class="actions"><button id="apply">Shift cues</button><button id="export">Export</button><button class="secondary" id="sample">Sample</button></div></section><section class="panel"><h3>Diagnostics</h3><div class="stats"><div>Cues<b id="count">0</b></div><div>Invalid<b id="bad">0</b></div><div>Overlaps<b id="over">0</b></div></div><p id="msg" class="muted">Open or paste subtitles.</p><div id="preview"></div></section></div><footer>Made to be useful · Runs in your browser · No account required</footer></main><script>const $=x=>document.getElementById(x);let cues=[];function ms(s){let m=s.trim().match(/^(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})$/);return m?(+m[1]*3600+ +m[2]*60+ +m[3])*1000+ +(m[4]+'00').slice(0,3):NaN}function ts(n,v){n=Math.max(0,Math.round(n));return [Math.floor(n/3600000),Math.floor(n%3600000/60000),Math.floor(n%60000/1000)].map(x=>String(x).padStart(2,'0')).join(':')+(v?'.':',')+String(n%1000).padStart(3,'0')}function parse(){cues=[];let bad=0,raw=$('src').value.replace(/^WEBVTT[^\n]*\n/i,'').trim();raw.split(/\n\s*\n/).forEach(b=>{let l=b.split(/\r?\n/),i=l.findIndex(x=>x.includes('-->'));if(i<0)return;let p=l[i].split('-->'),s=ms(p[0]),e=ms(p[1].trim().split(/\s+/)[0]);if(!Number.isFinite(s)||!Number.isFinite(e)||e<=s){bad++;return}cues.push({s,e,t:l.slice(i+1).join('\n')})});cues.sort((a,b)=>a.s-b.s);let o=0;for(let i=1;i<cues.length;i++)if(cues[i].s<cues[i-1].e)o++;$('count').textContent=cues.length;$('bad').textContent=bad;$('over').textContent=o;$('msg').textContent=bad?'Invalid timestamps found.':o?'Overlapping cues found.':'No timing issues found.';$('preview').innerHTML=cues.slice(0,10).map(c=>'<div class="item"><div><b>'+ts(c.s,0)+' → '+ts(c.e,0)+'</b><br><small>'+c.t.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])).replace(/\n/g,'<br>')+'</small></div></div>').join('')||'<div class="empty">No cues.</div>'}function out(){let v=$('fmt').value==='vtt';return(v?'WEBVTT\n\n':'')+cues.map((c,i)=>(v?'':i+1+'\n')+ts(c.s,v)+' --> '+ts(c.e,v)+'\n'+c.t).join('\n\n')}$('src').oninput=parse;$('file').onchange=async e=>{$('src').value=await e.target.files[0].text();$('fmt').value=e.target.files[0].name.endsWith('.vtt')?'vtt':'srt';parse()};$('apply').onclick=()=>{parse();let d=+$('shift').value*1000;cues=cues.map(c=>({...c,s:Math.max(0,c.s+d),e:Math.max(1,c.e+d)}));$('src').value=out();parse()};$('export').onclick=()=>{parse();let u=URL.createObjectURL(new Blob([out()],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='subtitles.'+$('fmt').value;a.click();URL.revokeObjectURL(u)};$('sample').onclick=()=>{$('src').value='1\n00:00:01,000 --> 00:00:03,000\nWelcome to SubTrack.\n\n2\n00:00:03,500 --> 00:00:05,500\nEdit subtitles here.';parse()};</script></body></html>
